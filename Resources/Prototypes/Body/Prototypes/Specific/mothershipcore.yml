# Kessler: Shitmed only attaches parts whose slot name contains the standard name for the part ("left hand").
- type: body
  id: MothershipCoreBody
  name: "core"
  root: torso
  slots:
    torso:
      part: TorsoBorg
      connections:
      - right hand 2
      - right hand
      - left hand
      - left hand 2
    left hand:
      part: SiliconLeftHand
    left hand 2:
      part: SiliconLeftHand
    right hand:
      part: SiliconRightHand
    right hand 2:
      part: SiliconRightHand
