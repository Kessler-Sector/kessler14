# Procurement contracts for the contract board (docs/kessler/design/departments.md, 5.2). Any station with a pallet
# console posts these; the holder completes one by selling the goods on that station's pallets. Pay is
# round(amount x minutesPerUnit) minutes x kessler.contracts.rate (150), on top of the pallet price; reputation is a
# point a minute on the track.

- type: procurementContract
  id: ContractSteel
  item: kessler-contract-item-steel
  stack: Steel
  minAmount: 60
  maxAmount: 150
  minutesPerUnit: 0.1
  track: Freight

