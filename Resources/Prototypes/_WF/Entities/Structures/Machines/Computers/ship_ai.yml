      enum.PdaUiKey.Key:
        toggleAction: ActionShipAiOpenPda
  - type: ShowJobIcons
  - type: ShowElectrocutionHUD
  - type: SSDIndicator

- type: entity
  parent:
  - Incorporeal
  - BaseMob
  id: ShipAiEye
  name: AI eye
  description: The AI's viewer.
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Transform
    gridTraversal: false
  - type: ShipAiEye
    mercyRange: 2
  - type: Eye
    pvsScale: 1.5
  - type: Visibility
    layer: 2
  - type: Sprite
    sprite: Mobs/Silicon/station_ai.rsi
    layers:
    - state: ai_camera
      shader: unshaded
      map: ["base"]

- type: soundCollection
