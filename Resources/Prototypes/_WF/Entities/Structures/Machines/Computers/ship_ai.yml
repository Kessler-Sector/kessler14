          ShipAiCasingShock: { state: cover_default }
          ShipAiCasingSyndicate: { state: cover_default }
          ShipAiCasingPumpkin: { state: cover_default }
          ShipAiCasingGold: { state: cover_full }
          ShipAiCasingEngineering: { state: cover_full }
          ShipAiCasingSoviet: { state: cover_full }
          ShipAiCasingNt: { state: cover_uneven }
          ShipAiCasingIndustrial: { state: cover_uneven }
          ShipAiCasingLgun: { state: cover_uneven }
          ShipAiCasingDwaine: { state: cover_split }
          ShipAiCasingAiles: { state: cover_split }
          ShipAiCasingSalvage: { state: cover_split }
          ShipAiCasingGardengear: { state: cover_split }
          ShipAiCasingTelegun: { state: cover_split }
