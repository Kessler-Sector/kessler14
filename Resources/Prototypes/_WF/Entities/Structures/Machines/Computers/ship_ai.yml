      enum.WiresVisuals.MaintenancePanelState:
        cover:
          True: { visible: true }
          False: { visible: false }
      enum.ShipAiVisuals.Accessory:
        accessory:
          ShipAiAccessoryNone: { visible: false }
          ShipAiAccessoryMoustache: { visible: true }
      enum.ShipAiVisuals.Static:
        static:
          True: { visible: true }
          False: { visible: false }
      enum.ShipAiVisuals.NoBrain:
        nobrain:
          True: { visible: true }
          False: { visible: false }
      enum.ShipAiVisuals.Screen:
        screen:
          None: { visible: false }
          ShipAiScreenBlue: { state: screen_blue, visible: true }
          ShipAiScreenWhite: { state: screen_white, visible: true }
          ShipAiScreenGrey: { state: screen_grey, visible: true }
          ShipAiScreenGreen: { state: screen_green, visible: true }
          ShipAiScreenRed: { state: screen_red, visible: true }
          ShipAiScreenPurple: { state: screen_purple, visible: true }
          ShipAiScreenPink: { state: screen_pink, visible: true }
          ShipAiScreenOrange: { state: screen_orange, visible: true }
          ShipAiScreenYellow: { state: screen_yellow, visible: true }
          ShipAiScreenCyan: { state: screen_cyan, visible: true }
  - type: InteractionOutline
  - type: ApcPowerReceiver
    needsPower: false
  - type: Computer
    board: ShipAiInterfaceCircuitboard
  - type: Construction
    graph: ShipAiCore
    node: core
    containers:
    - board
    - ship_ai_radio
    - ship_ai_cell
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
      station_ai_mind_slot: !type:ContainerSlot {}
      key_slots: !type:Container
      ship_ai_module: !type:ContainerSlot {}
      ship_ai_radio: !type:Container
      ship_ai_cell: !type:Container
  - type: ItemSlots
    slots:
      ship_ai_module:
        name: ship-ai-module-slot
        whitelist:
          components:
          - ShipAiModule
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyContainersBehaviour
        containers:
        - station_ai_mind_slot
        - key_slots
        - ship_ai_module
        - board
        - ship_ai_radio
        - ship_ai_cell
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: wired
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ContainerFill
    containers:
      ship_ai_radio:
      - RadioHandheld
      ship_ai_cell:
      - PowerCellMedium
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 5
  - type: GuideHelp
    guides:
    - ShipAi
  - type: RadarConsole
    maxRange: 256
  - type: PowerMonitoringConsole
  - type: PowerMonitoringCableNetworks
  - type: AtmosAlertsComputer
  - type: AtmosMonitoringConsole
    navMapTileColor: "#1a1a1a"
    navMapWallColor: "#404040"
  - type: StationAiHolder
    slot:
      name: station-ai-mind-slot
      disableEject: true
      whitelist:
        tags:
        - ShipAiCore
  - type: ContainerComp
    proto: ShipAiHeld
    container: station_ai_mind_slot
  - type: StationAiCore
    remoteEntityProto: ShipAiEye
  - type: StationAiWhitelist
  - type: ShipyardSellCondition
    reason: ship-ai-sale-blocked
  - type: EncryptionKeyHolder
    keySlots: 14
    keysExtractionMethod: Cutting
  - type: StatusIcon
  - type: ShipAiInterface
    baseChannels:
    - Binary
    - Common
    - Traffic
    - Greeting
    - Medical
    - Supply
    - Engineering
    - Science
    factions:
      Security: Cgp
      BlackMarket: Outlaw
      Syndicate: Outlaw
    bootTime: 3
    staticDamage: 75
    scanInterval: 1
    attackAlertCooldown: 10
    damageAlerts: true
    alertIntegrity:
    - 0.1
    attackSound:
      path: /Audio/_WF/Machines/ShipAi/announcement_chime.ogg
    bootSound:
      path: /Audio/_WF/Machines/ShipAi/computerboot_pc_start.ogg
    shutdownSound:
      path: /Audio/_WF/Machines/ShipAi/shieldgen_shutoff.ogg
    ejectDelay: 5
    remoteGrace: 3
    remoteRange: 32
    accessLevels:
    - Captain
    - Engineering
    - External
    - Frontier
    - Janitor
    - Mail
    - Maintenance
    - Medical
    - Service
    factionAccessLevels:
      Cgp:
      - Security
      - Brig
      Outlaw:
      - Pirate
  - type: Telephone
    compatibleRanges:
    - Grid
    - Map
    - Unlimited
    listeningRange: 0
    speakerVolume: Speak
    unlistedNumber: true
    transmissionRange: Map
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: Holopad
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
      enum.ShipAiAccessUiKey.Key:
        type: ShipAiAccessBoundUserInterface
      enum.StationAiCustomizationUiKey.Key:
        type: StationAiCustomizationBoundUserInterface
      enum.HolopadUiKey.AiRequestWindow:
        type: HolopadBoundUserInterface
      enum.HolopadUiKey.AiActionWindow:
        type: HolopadBoundUserInterface
      enum.PowerMonitoringConsoleUiKey.Key:
        type: PowerMonitoringConsoleBoundUserInterface
      enum.AtmosAlertsComputerUiKey.Key:
        type: AtmosAlertsComputerBoundUserInterface
      enum.AtmosMonitoringConsoleUiKey.Key:
        type: AtmosMonitoringConsoleBoundUserInterface
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface

- type: entity
  parent: ComputerShipAi
  id: ComputerShipAiFilled
  suffix: Core
  components:
  - type: StationAiHolder
    slot:
      name: station-ai-mind-slot
      disableEject: true
      startingItem: ShipAiCoreBrain
      whitelist:
        tags:
        - ShipAiCore

- type: entity
  parent: BaseStructureComputer
  id: ShipAiCoreFrame
  name: ship AI core frame
  description: A ship AI core under construction.
  components:
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 5
  - type: GuideHelp
    guides:
    - ShipAi
  - type: Construction
    graph: ShipAiCore
    node: frame
    containers:
    - board
    - ship_ai_radio
    - ship_ai_cell
  - type: ContainerContainer
    containers:
      board: !type:Container
      ship_ai_radio: !type:Container
      ship_ai_cell: !type:Container
  - type: Sprite
    sprite: _WF/Structures/Machines/ship_ai_core.rsi
    snapCardinals: true
    layers:
    - state: frame
    - state: frame_back
      map: ["back"]
      visible: false
    - state: frame_interface
      map: ["interface"]
      visible: false
    - state: frame_radio
      map: ["radio"]
      visible: false
    - state: frame_cell
      map: ["cell"]
      visible: false
    - state: casing_default
      map: ["casing"]
      visible: false
    - state: frame_top
      map: ["top"]
      visible: false
    - state: frame_wires
      map: ["wires"]
      visible: false
    - state: frame_glass
      map: ["glass"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        back:
          frame: { visible: false }
          plated: { visible: true }
          wired: { visible: true }
          boarded: { visible: true }
          radioed: { visible: true }
          celled: { visible: true }
          glassed: { visible: true }
        interface:
          frame: { visible: false }
          plated: { visible: false }
          wired: { visible: false }
          boarded: { visible: true }
          radioed: { visible: true }
          celled: { visible: true }
          glassed: { visible: true }
        radio:
          frame: { visible: false }
          plated: { visible: false }
          wired: { visible: false }
          boarded: { visible: false }
          radioed: { visible: true }
          celled: { visible: true }
          glassed: { visible: true }
        cell:
          frame: { visible: false }
          plated: { visible: false }
          wired: { visible: false }
          boarded: { visible: false }
          radioed: { visible: false }
          celled: { visible: true }
          glassed: { visible: true }
        casing:
          frame: { visible: false }
          plated: { visible: true }
          wired: { visible: true }
          boarded: { visible: true }
          radioed: { visible: true }
          celled: { visible: true }
          glassed: { visible: true }
        top:
          frame: { visible: false }
          plated: { visible: true }
          wired: { visible: true }
          boarded: { visible: true }
          radioed: { visible: true }
          celled: { visible: true }
          glassed: { visible: true }
        wires:
          frame: { visible: false }
          plated: { visible: false }
          wired: { visible: true }
          boarded: { visible: true }
          radioed: { visible: true }
          celled: { visible: true }
          glassed: { visible: true }
        glass:
          frame: { visible: false }
          plated: { visible: false }
          wired: { visible: false }
          boarded: { visible: false }
          radioed: { visible: false }
          celled: { visible: false }
          glassed: { visible: true }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: ShipAiHeld
  categories: [ HideSpawnMenu ]
  components:
  - type: ShipAi
    devices:
      components:
      - ApcPowerReceiver
      - ActivatableUI
      - GasMixer
      - AutoShootGun
    devicesBlacklist:
      components:
      - Openable
  - type: StationAiHeld
  - type: BankAccount
  - type: StationAiCustomization
    protoIds:
      ShipAiScreen: ShipAiScreenBlue
      StationAiHolograms: ShipAiHologramFace
  - type: HolographicAvatar
    layerData:
    - sprite: _WF/Structures/Machines/ship_ai_core.rsi
      state: screen_blue
    - sprite: _WF/Structures/Machines/ship_ai_core.rsi
      state: face_neutral
  - type: IgnoreUIRange
  - type: ComplexInteraction
  - type: Access
    tags:
    - Pirate
    - Pilot
    - Paramedic
    groups:
    - AllAccess
  - type: Alerts
  - type: ActionGrant
    actions:
    - ActionJumpToCore
    - ActionShipAiToggleEngines
    - ActionShipAiToggleGenerators
    - ActionShipAiToggleBolts
    - ActionShipAiToggleLights
    - ActionShipAiCustomize
    - ActionShipAiClearElectrified
    - ActionShipAiToggleApcs
    - ActionShipAiToggleShutters
    - ActionShipAiToggleBlastDoors
    - ActionShipAiToggleJobIcons
    - ActionShipAiOpenPower
    - ActionShipAiOpenAirAlerts
    - ActionShipAiOpenPipes
    - ActionShipAiOpenRadar
    - ActionOpenRemoteDevicesMenu
    - ActionAIViewLaws
  - type: UserInterface
    interfaces:
      enum.RemoteDeviceUiKey.Key:
        type: RemoteDevicesBoundUserInterface
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
      enum.PdaUiKey.Key:
        type: PdaBoundUserInterface
      enum.RingerUiKey.Key:
        type: RingerBoundUserInterface
      enum.CriminalRecordsConsoleKey.Key:
        type: CriminalRecordsConsoleBoundUserInterface
  - type: IntrinsicUI
