      map: ["casing"]
    - state: lights_default
      map: ["lights"]
      shader: unshaded
    - state: nobrain
      map: ["nobrain"]
      shader: unshaded
      visible: false
    - state: screen_blue
      map: ["screen"]
      shader: unshaded
      visible: false
    - state: face_neutral
