- type: entity
  parent: [ IDCardStandard, AgentIDCard ]
  id: WFOutlawIDCard
  name: normal ID card
  description: It's fine, don't worry about it.
  components:
  - type: PresetIdCard
    job: Wayfarer
  - type: Sprite
    layers:
    - state: default
    - state: idcontractor # Frontier: idpassenger<idcontractor
      sprite: _NF/Objects/Misc/id_cards.rsi # Frontier

- type: entity
  parent: IDCardStandard
  id: ShipAiIDCard
  name: ship AI ID card
  components:
  - type: PresetIdCard
    job: ShipAi
  - type: IdCard
    jobTitle: job-name-ship-ai
  - type: SuitSensor
    activationContainer: PDA-id
    controlsLocked: true
    randomMode: false
    mode: SensorOff
  - type: Sprite
    layers:
    - state: default
    - state: idshipai
      sprite: _WF/Objects/Misc/id_cards.rsi

- type: entity
  parent: ShipAiIDCard
  id: ShipAiCgpIDCard
  name: CGP ship AI ID card
  components:
  - type: PresetIdCard
    job: ShipAiCgp

- type: entity
  parent: ShipAiIDCard
  id: ShipAiOutlawIDCard
  name: Outlaw ship AI ID card
  components:
  - type: PresetIdCard
    job: ShipAiOutlaw

- type: entity
  parent: PassengerIDCard
  id: FlexibleJobIDCard
  name: flexible job ID card
  description: Allows one to change their job title on the fly. Ask a station rep to put your name on it!
  components:
  - type: PresetIdCard
    job: Wayfarer
  - type: Sprite
    layers:
    - state: default
    - state: idintern-service
  - type: AgentIDCard
  - type: ActivatableUI
    key: enum.AgentIDCardUiKey.Key
    inHandsOnly: true
    verbText: job-select-card-open-ui-verb
  - type: UserInterface
    interfaces:
      enum.AgentIDCardUiKey.Key:
        type: JobSelectBoundUserInterface

- type: entity
  parent: PassengerIDCard
  id: StationStaffFlexibleJobIDCard
  name: Station Staff Flexible Job ID Card
  description: Staff are permitted to change their job title to reflect specialisms. Please do be professional - Management
  components:
  - type: PresetIdCard
    job: StationStaff
  - type: Sprite
    layers:
    - state: default
    - state: idintern-service
  - type: AgentIDCard
  - type: ActivatableUI
    key: enum.AgentIDCardUiKey.Key
    inHandsOnly: true
    verbText: job-select-card-open-ui-verb
  - type: UserInterface
    interfaces:
      enum.AgentIDCardUiKey.Key:
        type: JobSelectBoundUserInterface
