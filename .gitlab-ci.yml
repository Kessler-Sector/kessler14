include:
  - local: .gitlab/ci/publish.yml
  - local: .gitlab/ci/validate-rsis.yml
  - local: .gitlab/ci/validate-mapfiles.yml
  - local: .gitlab/ci/validate-changelog.yml
  - local: .gitlab/ci/close-master-mr.yml
  - local: .gitlab/ci/publish-changelog.yml
  - local: .gitlab/ci/changelog.yml

stages:
  - lint
  - test
  - deploy
  - notify

workflow:
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Push pipelines on the default branch exist only for generate_changelog; all other jobs exclude push.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

# Override included rules so both validators always gate eligible MR builds.
validate_rsis:
  tags:
    - wf14-tests
  rules: &merge_request_checks
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "stable")'
    - when: never

validate_mapfiles:
  tags:
    - wf14-tests
  rules: *merge_request_checks

yaml_linter:
  stage: lint
  image: mcr.microsoft.com/dotnet/sdk:9.0
  interruptible: true
  tags:
    - wf14-tests
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  cache:
    key: "nuget-9.0"
    paths:
      - .nuget/packages
    policy: pull-push
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libfreetype6 libfontconfig1
    - rm -rf /var/lib/apt/lists/*
  rules:
    - when: never
  script:
    - dotnet restore Content.YAMLLinter/Content.YAMLLinter.csproj
    - dotnet build Content.YAMLLinter/Content.YAMLLinter.csproj --configuration Release --no-restore /p:WarningsAsErrors= /m
    - dotnet run --project Content.YAMLLinter/Content.YAMLLinter.csproj --configuration Release --no-build

build_test_debug:
  stage: test
  tags:
    - saas-linux-small-amd64
  needs:
    - job: validate_rsis
      artifacts: false
    - job: validate_mapfiles
      artifacts: false
  image: mcr.microsoft.com/dotnet/sdk:9.0
  interruptible: true
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  cache:
    key: "nuget-9.0"
    paths:
      - .nuget/packages
    policy: pull-push
  rules: *merge_request_checks
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libfreetype6 libfontconfig1
    - rm -rf /var/lib/apt/lists/*
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - cd RobustToolbox
    - git submodule update --init --recursive
    - cd ..
  script:
    - dotnet restore
    - dotnet build --configuration DebugOpt --no-restore /m
    - dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj --logger "trx;LogFileName=content-tests.trx" --results-directory TestResults -- NUnit.ConsoleOut=0
    - DOTNET_gcServer=1 dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "FullyQualifiedName!~ShipyardTest" --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed
  after_script:
    # Runs even when tests fail, so failures still show up in the MR report.
    - dotnet tool install --tool-path .trx2junit trx2junit --version 2.0.0 || true
    - .trx2junit/trx2junit TestResults/*.trx || true
  artifacts:
    when: always
    reports:
      junit: TestResults/*.xml

shipyard_tests:
  extends: build_test_debug
  # Unlike build_test_debug, this does not wait on the validators.
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
      changes:
        - "Resources/Maps/_NF/Shuttles/**/*.yml"
        - "Resources/Maps/_WF/Shuttles/**/*.yml"
        - "Resources/Prototypes/_NF/Shipyard/**/*.yml"
        - "Resources/Prototypes/_WF/Shipyard/**/*.yml"
        - "Content.IntegrationTests/Tests/_NF/ShipyardTests.cs"
    - when: never
  script:
    - dotnet restore
    - dotnet build --configuration DebugOpt --no-restore /m
    - DOTNET_gcServer=1 dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "FullyQualifiedName~ShipyardTest" --logger "trx;LogFileName=shipyard-tests.trx" --results-directory TestResults -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

