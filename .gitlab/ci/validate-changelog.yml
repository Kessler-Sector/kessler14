validate_changelog:
  stage: lint
  image: node:18
  interruptible: true
  needs: []
  tags:
    - wf14-tests
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cd Tools/_NF/changelog
    - node validate_changelog.js
