close_master_mr:
  stage: lint
  image: alpine:3.20
  needs: []
  interruptible: true
  tags:
    - wf14-tests
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop")'
    - when: never
  before_script:
    - apk add --no-cache curl
  script:
    - 'test -n "$CHANGELOG_GITLAB_TOKEN" || { echo "CHANGELOG_GITLAB_TOKEN (api) must be configured."; exit 1; }'
    - |
      MESSAGE='Thank you for your contribution! It appears you created a merge request from your master branch, this is [something you should avoid doing](https://jmeridth.com/posts/do-not-issue-pull-requests-from-your-master-branch/), and thus this merge request has been automatically closed.

      We suggest you follow [our git usage documentation](https://docs.spacestation14.com/en/general-development/setup/git-for-the-ss14-developer.html).

      You can move your current work from the master branch to another branch by following [these commands](https://ohshitgit.com/#accidental-commit-master). And then you may recreate your merge request using the new branch.'
    - MR_URL="${CI_API_V4_URL}/projects/${CI_MERGE_REQUEST_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}"
    - 'curl --fail-with-body --silent --show-error --request POST --header "PRIVATE-TOKEN: ${CHANGELOG_GITLAB_TOKEN}" --data-urlencode "body=${MESSAGE}" "${MR_URL}/notes" > /dev/null'
    - 'curl --fail-with-body --silent --show-error --request PUT --header "PRIVATE-TOKEN: ${CHANGELOG_GITLAB_TOKEN}" --data "state_event=close" "${MR_URL}" > /dev/null'
