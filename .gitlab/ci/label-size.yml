# Needs a project access token (api scope) in the masked CI/CD variable LABELER_TOKEN,
# since CI_JOB_TOKEN cannot edit merge requests.
# Uses scoped labels (size::*), so GitLab replaces any previous size label automatically.
label_size:
  stage: lint
  image:
    name: curlimages/curl:latest
    entrypoint: [""]
  interruptible: true
  tags:
    - wf14-tests
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      if [ -z "$LABELER_TOKEN" ]; then
        echo "LABELER_TOKEN is not set (missing, wrong name, or protected variable on an unprotected ref)"
        exit 1
      fi
      # Added + deleted lines as reported by GitLab for the MR diff.
      query='query($path: ID!, $iid: String!) { project(fullPath: $path) { mergeRequest(iid: $iid) { diffStatsSummary { additions deletions } } } }'
      response=$(curl --fail-with-body --silent \
        --header "PRIVATE-TOKEN: $LABELER_TOKEN" \
        --header "Content-Type: application/json" \
        --data "{\"query\": \"$query\", \"variables\": {\"path\": \"$CI_PROJECT_PATH\", \"iid\": \"$CI_MERGE_REQUEST_IID\"}}" \
        "$CI_API_GRAPHQL_URL") || { echo "GraphQL request failed: $response"; exit 1; }
      additions=$(echo "$response" | sed -n 's/.*"additions":\([0-9]*\).*/\1/p')
      deletions=$(echo "$response" | sed -n 's/.*"deletions":\([0-9]*\).*/\1/p')
      if [ -z "$additions" ] || [ -z "$deletions" ]; then
        echo "Could not read diff stats: $response"
        exit 1
      fi
      changes=$((additions + deletions))
      if   [ "$changes" -ge 5000 ]; then size=XL
      elif [ "$changes" -ge 1000 ]; then size=L
      elif [ "$changes" -ge 100 ];  then size=M
      elif [ "$changes" -ge 10 ];   then size=S
      else size=XS; fi
      echo "$changes changed lines -> size::$size"
      response=$(curl --fail-with-body --silent \
        --request PUT \
        --header "PRIVATE-TOKEN: $LABELER_TOKEN" \
        --data-urlencode "add_labels=size::$size" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID") || { echo "Label update failed: $response"; exit 1; }
